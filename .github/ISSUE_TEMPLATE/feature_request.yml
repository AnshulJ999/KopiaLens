name: Feature request
description: Suggest something KopiaLens should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The task or problem, in your own words.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
      description: How you picture it working. Rough ideas are fine.
  - type: textarea
    id: workaround
    attributes:
      label: How do you handle it today?
