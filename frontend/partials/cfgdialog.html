    <!-- Restore a settings backup / import an export (appconfig.js). Choose what to put back,
         see what changes, then the result with a restart. -->
    <template x-if="cfgDlg">
      <div class="fixed inset-0 z-[58] bg-black/40 flex items-center justify-center p-4 sm:p-6"
           @click.self="cfgDlg.busy || (cfgDlg = null)">
        <div role="dialog" aria-modal="true" class="w-[44rem] max-w-full rounded-lg border border-bd bg-surface shadow-xl flex flex-col text-sm">
          <div class="p-4 space-y-3 overflow-auto max-h-[80vh]">
            <template x-if="!cfgDlg.done">
              <div class="space-y-3">
                <h3 class="text-[0.9375rem] font-semibold leading-snug"
                    x-text="cfgDlg.mode === 'restore' ? 'Restore from ' + fmtAbs(cfgDlg.backup.at) + '?' : 'Import settings from this file?'"></h3>
                <template x-if="cfgDlg.mode === 'restore'">
                  <p class="text-xs text-muted" x-text="cfgKind(cfgDlg.backup) + (cfgDlg.backup.app_version ? ' · KopiaLens ' + cfgDlg.backup.app_version : '')"></p>
                </template>
                <template x-if="cfgDlg.mode === 'import'">
                  <p class="text-xs text-muted" x-text="'Exported ' + fmtAbs(cfgDlg.preview.exported_at) + (cfgDlg.preview.version ? ' · KopiaLens ' + cfgDlg.preview.version : '')"></p>
                </template>
                <div class="space-y-2">
                  <template x-for="g in CFG_GROUPS.filter((x) => cfgDlg.available.includes(x[0]))" :key="g[0]">
                    <div>
                      <label class="flex items-center gap-2 text-xs font-medium"><input autocomplete="off" type="checkbox" x-model="cfgDlg.groups[g[0]]"><span x-text="g[1]"></span></label>
                      <p x-show="CFG_GROUP_NOTE[g[0]] && cfgDlg.groups[g[0]]" class="ml-6 text-[0.6875rem]" style="color:var(--warn)" x-text="CFG_GROUP_NOTE[g[0]]"></p>
                    </div>
                  </template>
                </div>
                <!-- What putting it back changes, item by item; risky items can stay as they are now. -->
                <div class="space-y-2" data-testid="cfg-changes">
                  <div class="flex items-baseline gap-2">
                    <span class="text-xs font-medium">What changes</span>
                    <span class="text-[0.6875rem] text-muted" x-show="cfgDlg.plan" x-text="countOf(cfgChangeCount(), 'change') + (cfgKeptCount() ? ', ' + cfgKeptCount() + ' kept as now' : '')"></span>
                  </div>
                  <p class="text-[0.6875rem] text-muted" x-show="!cfgDlg.plan && !cfgDlg.planError">Working out what changes…</p>
                  <p class="text-[0.6875rem]" style="color:var(--danger)" x-show="cfgDlg.planError" x-text="cfgDlg.planError"></p>
                  <p class="text-[0.6875rem] text-muted" x-show="cfgDlg.plan && !cfgChangeCount()">Nothing differs from what you have now.</p>
                  <template x-for="sec in cfgSections()" :key="sec.title">
                    <div>
                      <div class="text-[0.6875rem] text-muted mb-1" x-text="sec.title"></div>
                      <div class="kl-list" style="max-height:16rem">
                        <template x-for="it in sec.items" :key="it.id">
                          <div class="li text-xs" :class="it.risky && cfgDlg.keep[it.id] ? 'opacity-60' : ''">
                            <span class="w-52 shrink-0 truncate" :title="it.label" x-text="cfgItemLabel(it)"></span>
                            <template x-if="Array.isArray(cfgItemChange(it))">
                              <span class="grow min-w-0 truncate" :title="cfgItemChange(it)[0] + ' → ' + cfgItemChange(it)[1]">
                                <span class="line-through text-muted" x-text="cfgItemChange(it)[0]"></span><span class="text-faint"> → </span><span class="font-medium" x-text="cfgItemChange(it)[1]"></span>
                              </span>
                            </template>
                            <template x-if="!Array.isArray(cfgItemChange(it))">
                              <span class="grow min-w-0 truncate text-muted" x-text="cfgItemChange(it)"></span>
                            </template>
                            <template x-if="it.risky">
                              <label class="shrink-0 flex items-center gap-1 text-[0.6875rem] whitespace-nowrap" title="Leave this as it is now">
                                <input autocomplete="off" type="checkbox" :checked="!!cfgDlg.keep[it.id]" @change="cfgDlg.keep = { ...cfgDlg.keep, [it.id]: $event.target.checked }"> Keep current</label>
                            </template>
                          </div>
                        </template>
                      </div>
                    </div>
                  </template>
                  <p class="text-[0.6875rem] text-muted" x-show="cfgDlg.plan && (cfgDlg.plan.risky || []).length">Ticked items stay as they are now: sign-in, remote access, permissions, who runs backups, accounts and keys.</p>
                </div>
                <p class="text-[0.6875rem] text-muted">Your current files are backed up first, so this can be undone.</p>
                <p class="text-xs" style="color:var(--danger)" x-show="cfgDlg.error" x-text="cfgDlg.error"></p>
              </div>
            </template>
            <template x-if="cfgDlg.done">
              <div class="space-y-3">
                <h3 class="text-[0.9375rem] font-semibold leading-snug" x-text="cfgDlg.mode === 'restore' ? 'Restored' : 'Imported'"></h3>
                <p class="text-xs" x-text="cfgDlg.done.label + ' ' + (cfgDlg.mode === 'restore' ? 'restored' : 'imported') + '. Restart KopiaLens to use them.'"></p>
                <p class="text-xs" style="color:var(--danger)" x-show="cfgDlg.error" x-text="cfgDlg.error"></p>
              </div>
            </template>
          </div>
          <div class="flex justify-end gap-2 border-t border-bd px-4 py-3">
            <template x-if="!cfgDlg.done">
              <div class="flex gap-2">
                <button type="button" @click="cfgDlg = null" :disabled="cfgDlg.busy" class="kl-btn">Cancel</button>
                <button type="button" @click="cfgApply()" :disabled="cfgDlg.busy || !cfgChosen().length" class="kl-btn primary"
                        x-text="cfgDlg.busy ? (cfgDlg.mode === 'restore' ? 'Restoring…' : 'Importing…') : (cfgDlg.mode === 'restore' ? 'Restore' : 'Import')"></button>
              </div>
            </template>
            <template x-if="cfgDlg.done">
              <div class="flex gap-2">
                <button type="button" @click="cfgDlg = null" class="kl-btn">Later</button>
                <button type="button" @click="cfgRestart()" class="kl-btn primary">Restart now</button>
              </div>
            </template>
          </div>
        </div>
      </div>
    </template>
