
              <!-- Connect form, shared by onboarding and "Add repository" (repos.js, cx*). Include it
                   inside an x-if="cx". -->
              <div class="space-y-4 text-sm">
                <p x-show="cx.loading" class="kl-note">Looking for kopia repositories on this computer…</p>

                <!-- Repositories connected in this session -->
                <template x-for="a in cx.added" :key="a.id">
                  <div class="rounded-md border p-3 space-y-2" :class="a.error ? 'border-warn-bd' : 'border-ok-bd'">
                    <div class="flex items-start gap-2">
                      <span class="pill" :class="a.error ? 'warn' : (a.summary ? 'ok' : '')" x-text="a.error ? 'Needs attention' : (a.summary ? (a.sample ? 'Ready' : 'Connected') : 'Checking…')"></span>
                      <span class="min-w-0 flex-1 text-xs text-muted truncate" :title="a.where" x-text="a.sample ? 'Made on this computer' : (a.backblaze ? (cx.bz && cx.bz.this_computer === false ? 'Backblaze on ' + cx.bz.computer : 'Backblaze on this computer') : [cxTypeLabel(a.type), a.where].filter(Boolean).join(' · '))"></span>
                      <button type="button" @click="cxRemoveAdded(a)" class="text-xs text-muted hover:text-fg">Remove</button>
                    </div>
                    <p x-show="a.summary" class="text-xs" x-text="cxSummaryLine(a)"></p>
                    <p x-show="cxEstimateLine(a)" class="text-xs text-muted" x-text="cxEstimateLine(a)"></p>
                    <p x-show="a.summary && !a.summary.snapshots && !a.backblaze" class="kl-note">No snapshots yet. A source shows up after its first backup.</p>
                    <template x-if="a.error">
                      <div class="space-y-2">
                        <p class="text-xs break-words" style="color:var(--warn)" x-text="a.error"></p>
                        <form @submit.prevent="cxUnlock(a)" class="flex flex-wrap items-end gap-2">
                          <label class="flex flex-col gap-1 text-xs font-medium flex-1 min-w-[12rem]">Repository password
                            <input type="password" x-model="a.pw" autocomplete="off" class="fld border border-bd bg-surface2"></label>
                          <button type="submit" class="kl-btn" :disabled="!a.pw || a.unlocking" x-text="a.unlocking ? 'Checking…' : 'Try again'"></button>
                        </form>
                        <p class="kl-note">kopia's own password for this repository, if it doesn't remember it. Not your KopiaLens password.</p>
                      </div>
                    </template>
                    <div class="grid gap-2 sm:grid-cols-[1fr_9rem]">
                      <label class="flex flex-col gap-1 text-xs font-medium">Name
                        <input autocomplete="off" type="text" x-model="a.name" @change="cxRename(a)" class="fld border border-bd bg-surface2"></label>
                      <label class="flex flex-col gap-1 text-xs font-medium"><span>Short name <span class="font-normal text-muted" title="Used where space is tight, like the index strip">(optional)</span></span>
                        <input autocomplete="off" type="text" x-model="a.short_name" @change="cxRename(a)" maxlength="12" class="fld border border-bd bg-surface2"></label>
                    </div>
                  </div>
                </template>

                <!-- Found on this computer -->
                <template x-if="!cx.loading && (cxCandidates().length || cxBzOffered())">
                  <div class="kl-sec">
                    <div class="h" x-text="cx.bz && cx.bz.this_computer === false && !cxCandidates().length ? 'Backblaze on another computer' : 'Found on this computer'"></div>
                    <div class="rounded-md border border-bd divide-y divide-[var(--bd)]">
                      <template x-if="cxBzOffered()">
                        <label class="flex items-start gap-3 p-3 cursor-pointer hover:bg-head" data-testid="cx-backblaze">
                          <input autocomplete="off" type="checkbox" class="mt-0.5" x-model="cx.bzPicked">
                          <span class="min-w-0 flex-1">
                            <span class="block font-medium">Backblaze Personal Backup</span>
                            <span class="block text-xs text-muted" x-text="(cx.bz.this_computer === false ? 'From ' + cx.bz.computer + ' · ' : '') + countOf(cx.bz.drives, 'drive') + ' backed up · see what Backblaze backs up and what it skips'"></span>
                          </span>
                        </label>
                      </template>
                      <template x-for="c in cxCandidates()" :key="c.config_file">
                        <label class="flex items-start gap-3 p-3 cursor-pointer hover:bg-head">
                          <input autocomplete="off" type="checkbox" class="mt-0.5" x-model="cx.picked[c.config_file]">
                          <span class="min-w-0 flex-1">
                            <span class="block font-medium truncate" x-text="c.folder === 'blinkdisk' ? 'BlinkDisk vault' : ((c.description || '').trim() || cxWhere(c) || c.filename)"></span>
                            <span class="block text-xs text-muted truncate" :title="cxWhere(c)" x-text="[cxTypeLabel(c.type), cxWhere(c)].filter(Boolean).join(' · ') + (c.kopiaui ? ' · also used by KopiaUI' : '') + (c.folder === 'blinkdisk' ? ' · needs the vault password' : '')"></span>
                            <span x-show="c.folder !== 'blinkdisk'" class="block text-[0.6875rem] text-faint truncate" x-text="c.filename"></span>
                            <template x-if="c.type === 'server'">
                              <span class="block text-xs mt-1" style="color:var(--warn)">Through a kopia server: browse-only. Space analysis and cleanup need direct access to the storage.</span>
                            </template>
                          </span>
                        </label>
                      </template>
                    </div>
                    <div class="flex items-center gap-2">
                      <button type="button" @click="cxUseSelected()" class="kl-btn primary" :disabled="!cxPickedCount() || cx.busy"
                              x-text="cx.busy ? 'Connecting…' : (cxPickedCount() > 1 ? 'Use ' + cxPickedCount() + ' repositories' : 'Use this repository')"></button>
                    </div>
                  </div>
                </template>



                <!-- Add another: connect an existing repository or create one -->
                <template x-if="!cx.loading && !cx.mode && cxKopiaOk()">
                  <div class="kl-sec">
                    <div class="h" x-text="cxCandidates().length || cx.added.some((a) => !a.backblaze) ? 'Add another repository' : 'No kopia repositories found on this computer'"></div>
                    <div class="grid gap-2 sm:grid-cols-2">
                      <button type="button" @click="cxStart('existing')" class="rounded-md border border-bd p-3 text-left hover:bg-head">
                        <span class="block font-medium">Connect to an existing one</span>
                        <span class="block text-xs text-muted">A folder, B2, S3, SFTP, a kopia server…</span></button>
                      <button type="button" @click="cxStart('create')" class="rounded-md border border-bd p-3 text-left hover:bg-head" :class="obNewcomer() ? 'order-first' : ''">
                        <span class="block font-medium">Create a new repository<span x-show="obNewcomer()" class="pill ok ml-1.5">Recommended</span></span>
                        <span class="block text-xs text-muted">Start backing up with kopia</span></button>
                    </div>
                  </div>
                </template>

                <!-- Backblaze is here but its data folder can't be read (permissions, macOS privacy settings) -->
                <template x-if="!cx.loading && !cx.mode && cx.bz && cx.bz.blocked && !cx.bz.added">
                  <div class="kl-sec space-y-2" data-testid="cx-bz-blocked">
                    <p class="text-xs" x-text="cx.bz.host_mac
                      ? 'Backblaze is on this Mac, but macOS isn\'t letting KopiaLens read its data. Allow KopiaLens in System Settings › Privacy & Security › Full Disk Access, then check again.'
                      : 'Backblaze\'s data folder is here, but KopiaLens can\'t open it. Check that this account can read ' + cx.bz.blocked_path + ', then check again.'"></p>
                    <button type="button" class="kl-btn" :disabled="cx.bzFolderBusy" @click="cxBzRecheck()" x-text="cx.bzFolderBusy ? 'Checking…' : 'Check again'"></button>
                  </div>
                </template>

                <!-- Backblaze on another computer: read its shared data folder -->
                <template x-if="!cx.loading && !cx.mode && cx.bz && !cx.bz.found && !cx.bz.added">
                  <div data-testid="cx-bz-other">
                    <button type="button" x-show="!cx.bzOther" @click="cx.bzOther = true" class="text-xs text-link">Backblaze on another computer?</button>
                    <form x-show="cx.bzOther" @submit.prevent="cxBzFolder()" class="kl-sec space-y-2">
                      <div class="h">Backblaze on another computer</div>
                      <p class="kl-note">Share its Backblaze data folder (bzdata) and enter it here. KopiaLens only reads it.</p>
                      <div class="flex flex-wrap items-end gap-2">
                        <label class="flex flex-col gap-1 text-xs font-medium flex-1 min-w-[16rem]">Backblaze data folder
                          <input autocomplete="off" type="text" x-model="cx.bzFolder" class="fld border border-bd bg-surface2" placeholder="e.g. \\OTHER-PC\bzdata or /Volumes/bzdata"></label>
                        <button type="submit" class="kl-btn" :disabled="!(cx.bzFolder || '').trim() || cx.bzFolderBusy" x-text="cx.bzFolderBusy ? 'Checking…' : 'Use folder'"></button>
                      </div>
                      <p x-show="cx.bzFolderError" class="text-xs break-words" style="color:var(--warn)" x-text="cx.bzFolderError"></p>
                    </form>
                  </div>
                </template>

                <template x-if="cx.mode">
                  <form @submit.prevent="cxSubmit()" class="rounded-md border border-bd p-3 space-y-3">
                    <div class="flex items-center gap-2">
                      <span class="font-medium" x-text="cx.mode === 'create' ? 'Create a new repository' : 'Connect to an existing repository'"></span>
                      <button type="button" @click="cx.mode = ''; cx.error = ''" class="ml-auto text-xs text-muted hover:text-fg">Cancel</button>
                    </div>
                    <div>
                      <div class="text-xs font-medium mb-1">Storage type</div>
                      <div class="kl-chips">
                        <template x-for="p in cxProviderList()" :key="p.key">
                          <button type="button" class="kl-chip" :class="cx.provider === p.key ? 'on' : ''" @click="cxSetProvider(p.key)" x-text="p.label"></button>
                        </template>
                      </div>
                      <p class="kl-note mt-1" x-show="cxSpec()" x-text="cxSpec() && cxSpec().summary"></p>
                    </div>

                    <template x-if="cx.provider === 'server' && !cx.serverOk">
                      <div class="space-y-2">
                        <div class="kl-callout">Through a kopia server you can browse snapshots and sources. Space analysis, dedup and cleanup need direct access to the storage: install KopiaLens on the computer that runs the kopia server, or connect to the storage itself (a folder, B2, S3…).</div>
                        <div class="flex gap-2">
                          <button type="button" class="kl-btn" @click="cxSetProvider('filesystem')">Connect to storage directly</button>
                          <button type="button" class="kl-btn" @click="cx.serverOk = true">Continue with browsing only</button>
                        </div>
                      </div>
                    </template>

                    <template x-if="cxSpec() && (cx.provider !== 'server' || cx.serverOk)">
                      <div class="space-y-3">
                        <div class="grid gap-2 sm:grid-cols-2">
                          <template x-for="f in cxFieldList(false)" :key="cx.provider + f.key">
                            <label class="flex text-xs font-medium" :class="f.kind === 'bool' ? 'items-center gap-2 sm:col-span-2' : 'flex-col gap-1'" :title="f.kind === 'bool' ? f.help : ''">
                              <template x-if="f.kind === 'bool'"><input autocomplete="off" type="checkbox" x-model="cx.fields[f.key]"></template>
                              <span x-text="f.label + (f.required ? '' : ' (optional)')"></span>
                              <template x-if="f.kind !== 'bool' && f.kind !== 'path'"><input :type="cxInputType(f)" x-model="cx.fields[f.key]" :aria-label="f.label" :placeholder="f.placeholder || ''" :autocomplete="f.secret ? 'off' : 'on'" spellcheck="false" class="fld border border-bd bg-surface2 font-normal"></template>
                              <template x-if="f.kind === 'path'">
                                <span class="flex gap-2"><input autocomplete="off" type="text" x-model="cx.fields[f.key]" :aria-label="f.label + (f.help ? ' ' + f.help : '')" spellcheck="false" class="fld grow min-w-0 border border-bd bg-surface2 font-normal" data-testid="cx-path">
                                  <button type="button" class="kl-btn" @click.prevent="cxBrowse(f.key)" title="Pick a folder on the computer running KopiaLens">Browse…</button></span>
                              </template>
                              <span x-show="f.help && f.kind !== 'bool'" class="kl-note font-normal" x-text="cx.mode === 'create' && f.help_create ? f.help_create : f.help"></span>
                            </label>
                          </template>
                        </div>
                        <div x-show="cxIdentityFields().length" class="space-y-1" data-testid="cx-identity">
                          <div class="text-xs font-medium">Connect as <span class="font-normal text-muted">(optional)</span></div>
                          <div class="grid gap-2 sm:grid-cols-2">
                            <template x-for="f in cxIdentityFields()" :key="cx.provider + f.key">
                              <label class="flex flex-col gap-1 text-xs"><span x-text="f.identity === 'username' ? 'User' : 'Computer'"></span>
                                <input type="text" x-model="cx.fields[f.key]" :aria-label="f.label" :placeholder="f.placeholder || ''" autocomplete="off" spellcheck="false" class="fld border border-bd bg-surface2"></label>
                            </template>
                          </div>
                          <p class="kl-note" x-text="cx.provider === 'server' ? 'Your account on the kopia server. Leave empty to use this computer\'s names.' : cx.mode === 'create' ? 'Leave empty to use this computer\'s names.' : 'Leave empty to use this computer\'s names. Fill in to continue another computer\'s backups.'"></p>
                        </div>
                        <div class="grid gap-2 sm:grid-cols-2" data-testid="cx-config-location">
                          <label class="flex flex-col gap-1 text-xs font-medium" title="The file where kopia keeps this connection: where the repository is and how to reach it">Connection file
                            <select autocomplete="off" x-model="cx.cfgLoc" class="fld border border-bd bg-surface2 font-normal">
                              <option value="data">KopiaLens's folder</option>
                              <option value="kopia" x-show="cx.kopiaFolderOk">kopia's folder, shared with KopiaUI</option>
                              <option value="folder">Another folder…</option>
                            </select></label>
                          <label x-show="cx.cfgLoc === 'folder'" class="flex flex-col gap-1 text-xs font-medium">Folder
                            <input autocomplete="off" type="text" x-model="cx.cfgFolder" spellcheck="false" class="fld border border-bd bg-surface2 font-normal"></label>
                          <p x-show="cx.cfgLoc === 'kopia'" class="kl-note sm:col-span-2" style="color:var(--warn)">KopiaUI will list this repository too, and may run its own backups and maintenance on it.</p>
                        </div>
                        <details x-show="cxFieldList(true).length || cx.mode === 'create'" class="text-xs">
                          <summary class="cursor-pointer text-muted">Advanced options</summary>
                          <p class="kl-note mt-1">Most connections don't need these.</p>
                          <div class="grid gap-x-3 gap-y-2.5 sm:grid-cols-2 mt-2">
                            <template x-for="f in cxFieldList(true)" :key="cx.provider + f.key">
                              <label class="flex text-xs font-medium" :class="f.kind === 'bool' ? 'items-start gap-2 sm:col-span-2' : f.kind === 'lines' ? 'flex-col gap-1 sm:col-span-2' : 'flex-col gap-1'">
                                <template x-if="f.kind === 'bool'"><input autocomplete="off" type="checkbox" x-model="cx.fields[f.key]" class="mt-0.5"></template>
                                <span><span x-text="f.label"></span>
                                  <span x-show="f.kind === 'bool' && f.help" class="block font-normal text-muted" x-text="f.help"></span>
                                  <span x-show="f.kind === 'bool' && f.warn && cx.fields[f.key]" class="block font-normal" style="color:var(--warn)"
                                        x-text="cx.mode === 'create' && f.warn_create ? f.warn_create : f.warn"></span></span>
                                <template x-if="f.kind === 'lines'"><textarea x-model="cx.fields[f.key]" :aria-label="f.label" :placeholder="f.placeholder || ''" rows="3" autocomplete="off" spellcheck="false" class="fld border border-bd bg-surface2 font-normal font-mono"></textarea></template>
                                <template x-if="f.kind !== 'bool' && f.kind !== 'lines'"><input :type="cxInputType(f)" x-model="cx.fields[f.key]" :aria-label="f.label" :placeholder="f.placeholder || ''" autocomplete="off" spellcheck="false" class="fld border border-bd bg-surface2 font-normal"></template>
                                <span x-show="f.kind !== 'bool' && f.help" class="kl-note font-normal" x-text="f.help"></span>
                              </label>
                            </template>
                          </div>
                          <template x-if="cx.mode === 'create'">
                            <div class="mt-3 space-y-2" data-testid="cx-format">
                              <div class="font-medium">Repository format <span class="font-normal text-muted">· can't be changed later</span></div>
                              <div class="grid gap-x-3 gap-y-2.5 sm:grid-cols-2">
                                <template x-for="row in [['encryption', 'Encryption', 'How backup data is encrypted. Both are strong; ChaCha20 can be faster on computers without AES support.'],
                                                         ['block_hash', 'Hash', 'How kopia recognises identical pieces of data.'],
                                                         ['object_splitter', 'Splitter', 'How files are cut into pieces. Dynamic finds more identical data between versions; the size is the average piece.'],
                                                         ['ecc_overhead_percent', 'Error correction', 'Stores repair data so kopia can fix small damage to stored files, such as bit rot. Uses the extra space chosen.'],
                                                         ['format_version', 'Format version', 'Only needed when an older kopia must open this repository.']]" :key="row[0]">
                                  <label class="flex flex-col gap-1 text-xs font-medium"><span x-text="row[1]"></span>
                                    <select autocomplete="off" x-model="cx.format[row[0]]" class="fld border border-bd bg-surface2 font-normal">
                                      <template x-for="(v, i) in (cx.formatChoices[row[0]] || [])" :key="v">
                                        <option :value="v" x-text="cxFormatLabel(row[0], v) + (i === 0 ? ' (default)' : '')"></option>
                                      </template>
                                    </select>
                                    <span class="kl-note font-normal" x-text="row[2]"></span></label>
                                </template>
                              </div>
                            </div>
                          </template>
                        </details>
                        <div x-show="cxSpec().password" class="grid gap-2" :class="cx.mode === 'create' ? 'sm:grid-cols-2' : ''">
                          <label class="flex flex-col gap-1 text-xs font-medium">Repository password
                            <input type="password" x-model="cx.password" :autocomplete="cx.mode === 'create' ? 'new-password' : 'off'" class="fld border border-bd bg-surface2"></label>
                          <label x-show="cx.mode === 'create'" class="flex flex-col gap-1 text-xs font-medium">Confirm password
                            <input type="password" x-model="cx.confirm" autocomplete="new-password" class="fld border border-bd bg-surface2"></label>
                          <span class="kl-note font-normal" :class="cx.mode === 'create' ? 'sm:col-span-2' : ''" x-text="cxPasswordNote()"></span>
                        </div>
                        <label class="flex flex-col gap-1 text-xs font-medium"><span>Name <span class="font-normal text-muted">(optional)</span></span>
                          <input autocomplete="off" type="text" x-model="cx.name" class="fld border border-bd bg-surface2 font-normal"></label>
                        <div class="flex justify-end">
                          <button type="submit" class="kl-btn primary" :disabled="cx.busy" x-text="cx.busy ? (cx.mode === 'create' ? 'Creating…' : 'Connecting…') : (cx.mode === 'create' ? 'Create repository' : 'Connect')"></button>
                        </div>
                      </div>
                    </template>
                  </form>
                </template>

                <p class="text-xs break-words" style="color:var(--danger)" x-show="cx.error" x-text="cx.error"></p>
              </div>
