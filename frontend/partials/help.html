    <!-- Update available: what is out, whether the licence covers it, where to get it. -->
    <div x-show="showUpdate" @click.self="showUpdate = false" x-cloak class="fixed inset-0 z-50 bg-black/50 flex items-center justify-center p-6">
      <div class="w-[28rem] max-w-full rounded-lg border border-bd bg-surface text-sm" role="dialog" aria-labelledby="updTitle">
        <div class="flex items-center gap-2 px-4 pt-3 pb-2 border-b border-bd">
          <div id="updTitle" class="font-medium" x-text="update().latest ? 'KopiaLens ' + update().latest + ' is out' : 'Updates'"></div>
          <button @click="showUpdate = false" class="ml-auto kl-btn quiet" title="Close">&times;</button>
        </div>
        <div class="p-4 space-y-3">
          <div class="flex items-center justify-between"><span class="text-muted">You have</span><span x-text="update().version"></span></div>
          <template x-if="update().licence">
            <div class="kl-callout" style="border-color:var(--warn-bd);background:var(--warn-bg);color:var(--warn)">
              <span x-text="'Your licence covers KopiaLens ' + update().licence.covers_through + '.x. Updating to ' + update().latest + ' turns Pro off.'"></span>
              <span x-show="update().licence.latest_covered" x-text="' The latest ' + update().licence.covers_through + '.x is ' + update().licence.latest_covered + '.'"></span>
            </div>
          </template>
          <div class="kl-note" x-show="update().notice" x-text="update().notice"></div>
          <div x-show="updateProgress()" :class="update().install && update().install.state === 'failed' ? 'text-warn' : ''">
            <span x-text="updateProgress()"></span>
            <span class="kl-note block" x-show="update().install && update().install.error" x-text="update().install && update().install.error"></span>
          </div>
        </div>
        <div class="kl-footer">
          <button class="kl-btn quiet" x-show="update().can_install && update().url" @click="updateDownload()">Download instead</button>
          <span class="spacer"></span>
          <button class="kl-btn" @click="showUpdate = false" x-text="updateInstalling() ? 'Close' : 'Later'"></button>
          <button class="kl-btn primary" x-show="update().can_install" @click="installUpdate()" :disabled="updateInstalling()">Install and restart</button>
          <button class="kl-btn primary" x-show="!update().can_install" @click="updateDownload()" :disabled="!update().url">Get it</button>
        </div>
      </div>
    </div>

    <!-- Report a problem: describe it; one click saves the diagnostics file and opens the issue or email. -->
    <div x-show="showReport" @click.self="showReport = false" x-cloak class="fixed inset-0 z-[56] bg-black/50 flex items-center justify-center p-6">
      <template x-if="report">
        <div class="w-[32rem] max-w-full rounded-lg border border-bd bg-surface text-sm" role="dialog" aria-labelledby="reportTitle" data-testid="report-dialog">
          <div class="flex items-center gap-2 px-4 pt-3 pb-2 border-b border-bd">
            <div id="reportTitle" class="font-medium">Report a problem</div>
            <button @click="showReport = false" class="ml-auto kl-btn quiet" title="Close">&times;</button>
          </div>
          <div class="p-4 space-y-3">
            <label class="flex flex-col gap-1 text-xs font-medium">What happened?
              <textarea autocomplete="off" x-model="report.what" rows="4" class="fld border border-bd bg-surface2 font-normal resize-y"></textarea></label>
            <label class="flex flex-col gap-1 text-xs font-medium"><span>What did you expect? <span class="font-normal text-muted">(optional)</span></span>
              <textarea autocomplete="off" x-model="report.expected" rows="2" class="fld border border-bd bg-surface2 font-normal resize-y"></textarea></label>
            <div class="flex flex-wrap items-center gap-2 text-xs">
              <label class="flex items-center gap-2"><input autocomplete="off" type="checkbox" x-model="report.attach">Attach a diagnostics file <span class="text-muted">(names hidden)</span></label>
              <button type="button" class="underline underline-offset-2" @click="openDiagnostics(false)">Preview</button>
            </div>
            <div class="text-xs" data-testid="report-how">
              <div class="font-medium mb-1">How it works</div>
              <ol class="space-y-0.5">
                <template x-for="(s, i) in reportSteps()" :key="i">
                  <li class="flex gap-2"><span class="inline-flex h-4 w-4 shrink-0 items-center justify-center rounded-full border text-[0.625rem]" :class="s[1] ? 'border-ok-bd text-ok' : 'border-bd text-muted'"><i x-show="s[1]" class="ic ic-check"></i><span x-show="!s[1]" x-text="i + 1"></span></span><span x-text="s[0]"></span></li>
                </template>
              </ol>
            </div>
            <div x-show="report.saved" class="kl-callout" style="border-color:var(--ok-bd);background:var(--ok-bg);color:var(--ok)">
              <span x-text="report.saved"></span>
              <a x-show="report.openUrl" :href="report.openUrl" target="_blank" rel="noopener" class="underline underline-offset-2 ml-1" x-text="report.openLabel"></a>
            </div>
            <p x-show="report.mailTo" class="text-xs text-muted">No email app opened? Write to <span class="text-fg" x-text="report.mailTo"></span>
              <button type="button" class="kl-btn ml-1" style="height:22px" @click="copyText(report.mailTo)">Copy</button></p>
            <p class="text-xs" style="color:var(--danger)" x-show="report.error" x-text="report.error"></p>
          </div>
          <div class="kl-footer">
            <button class="kl-btn" @click="showReport = false">Cancel</button>
            <span class="spacer"></span>
            <button class="kl-btn" x-show="help && help.pro" @click="reportSend('email')" :disabled="report.busy">Email support</button>
            <button class="kl-btn primary" @click="reportSend('issue')" :disabled="report.busy" x-text="report.busy ? 'Preparing…' : 'Open a GitHub issue'"></button>
          </div>
        </div>
      </template>
    </div>

    <!-- Give feedback: a short message to the developer, through the check-in service. -->
    <div x-show="showFeedback" @click.self="showFeedback = false" x-cloak class="fixed inset-0 z-[56] bg-black/50 flex items-center justify-center p-6">
      <template x-if="fbk">
        <div class="w-[30rem] max-w-full rounded-lg border border-bd bg-surface text-sm" role="dialog" aria-labelledby="fbTitle" data-testid="feedback-dialog">
          <div class="flex items-center gap-2 px-4 pt-3 pb-2 border-b border-bd">
            <div id="fbTitle" class="font-medium">Give feedback</div>
            <button @click="showFeedback = false" class="ml-auto kl-btn quiet" title="Close">&times;</button>
          </div>
          <template x-if="!fbk.sent">
            <div class="p-4 space-y-3">
              <label class="flex flex-col gap-1 text-xs font-medium">What's on your mind?
                <textarea autocomplete="off" x-model="fbk.message" rows="5" maxlength="2000" class="fld border border-bd bg-surface2 font-normal resize-y"></textarea></label>
              <div class="flex flex-wrap items-center gap-2 text-xs">
                <span class="font-medium">How's KopiaLens so far? <span class="font-normal text-muted">(optional)</span></span>
                <span class="flex items-center" role="radiogroup" aria-label="Rating">
                  <template x-for="n in [1, 2, 3, 4, 5]" :key="n">
                    <button type="button" class="px-0.5 text-base" role="radio" :aria-checked="fbk.rating === n" :aria-label="n + ' of 5'"
                            :class="fbk.rating && n <= fbk.rating ? 'text-warn' : 'text-faint'" @click="fbk.rating = fbk.rating === n ? null : n"><i class="ic" :class="fbk.rating && n <= fbk.rating ? 'ic-star-fill' : 'ic-star'"></i></button>
                  </template>
                </span>
              </div>
              <label class="flex flex-col gap-1 text-xs font-medium"><span>Email, if you'd like a reply <span class="font-normal text-muted">(optional)</span></span>
                <input type="email" x-model="fbk.email" autocomplete="email" class="fld border border-bd bg-surface2 font-normal"></label>
              <label class="flex items-center gap-2 text-xs"><input autocomplete="off" type="checkbox" x-model="fbk.quote">KopiaLens may quote this on its website, without your name</label>
              <p class="kl-note" x-text="'Also sent: KopiaLens ' + ((help && help.version) || '') + ', ' + ((help && help.install_type) || '') + '.'"></p>
              <p class="text-xs text-muted">Found a bug? <button type="button" class="text-fg underline underline-offset-2" @click="showFeedback = false; openReport()">Report a problem</button> instead.</p>
              <p class="text-xs" style="color:var(--danger)" x-show="fbk.error" x-text="fbk.error"></p>
            </div>
          </template>
          <template x-if="fbk.sent">
            <div class="p-4">Thanks, your feedback was sent.</div>
          </template>
          <div class="kl-footer">
            <span class="spacer"></span>
            <button class="kl-btn" @click="showFeedback = false" x-text="fbk.sent ? 'Close' : 'Cancel'"></button>
            <button class="kl-btn primary" x-show="!fbk.sent" @click="feedbackSend()" :disabled="fbk.busy" x-text="fbk.busy ? 'Sending…' : 'Send'"></button>
          </div>
        </div>
      </template>
    </div>

    <!-- Diagnostics bundle: choose what goes in, preview it, download it, report the problem. -->
    <div x-show="showDiag" @click.self="showDiag = false" x-cloak class="fixed inset-0 z-[57] bg-black/50 flex items-center justify-center p-6">
      <template x-if="diag">
        <div class="w-[56rem] max-w-full max-h-[90vh] overflow-hidden rounded-lg border border-bd bg-surface text-sm flex flex-col" role="dialog" aria-labelledby="diagTitle">
          <div class="shrink-0 flex items-center gap-2 px-4 pt-3 pb-2 border-b border-bd">
            <div id="diagTitle" class="font-medium" x-text="diag.report ? 'Report a problem' : 'Diagnostics bundle'"></div>
            <span class="kl-note" x-show="diag.id" x-text="'Bundle ' + diag.id"></span>
            <button @click="showDiag = false" class="ml-auto kl-btn quiet" title="Close">&times;</button>
          </div>
          <div class="flex-1 min-h-0 flex flex-col sm:flex-row">
            <div class="sm:w-60 shrink-0 p-4 space-y-3 border-b sm:border-b-0 sm:border-r border-bd overflow-auto">
              <div>
                <div class="text-xs font-medium mb-1">Always included</div>
                <div class="kl-note">Version, system, browser, licence (Free or Pro), repositories with index size and failed index runs, changed settings. Never passwords, keys or licence codes.</div>
              </div>
              <div class="space-y-1.5">
                <div class="text-xs font-medium">Also include</div>
                <div class="flex items-center gap-2">
                  <label class="flex items-center gap-2"><input autocomplete="off" type="checkbox" x-model="diag.sections.problems" @change="diagPreview()"> Recent problems</label>
                  <select autocomplete="off" class="fld border border-bd bg-surface2 text-xs" style="height:24px;width:auto" x-model.number="diag.days" :disabled="!diag.sections.problems"
                          @change="diagPreview()" aria-label="Period for recent problems">
                    <option value="1">1 day</option><option value="7">7 days</option><option value="30">30 days</option>
                  </select>
                </div>
                <label class="flex items-center gap-2"><input autocomplete="off" type="checkbox" x-model="diag.sections.app_log" @change="diagPreview()"> App log</label>
                <label class="flex items-center gap-2"><input autocomplete="off" type="checkbox" x-model="diag.sections.index_logs" @change="diagPreview()"> Indexing logs</label>
                <label class="flex items-center gap-2"><input autocomplete="off" type="checkbox" x-model="diag.sections.history" @change="diagPreview()"> Action and job history</label>
                <label class="flex items-center gap-2"><input autocomplete="off" type="checkbox" x-model="diag.sections.settings" @change="diagPreview()"> Settings</label>
                <label class="flex items-center gap-2"><input autocomplete="off" type="checkbox" x-model="diag.sections.kopia_status" @change="diagPreview()"> Repository format (asks kopia)</label>
              </div>
              <label class="flex items-start gap-2">
                <input autocomplete="off" type="checkbox" class="mt-0.5" x-model="diag.anonymise" @change="diagPreview()">
                <span>Anonymise<span class="kl-note block">Replaces paths, user and computer names, emails and addresses with codes.</span></span>
              </label>
            </div>
            <div class="flex-1 min-w-0 flex flex-col p-4 gap-2">
              <div class="flex flex-wrap gap-1">
                <template x-for="name in diagFileNames()" :key="name">
                  <button class="kl-chip" :class="diag.file === name ? 'on' : ''" @click="diag.file = name" x-text="name"></button>
                </template>
              </div>
              <div x-show="diag.error" class="kl-callout" x-text="'Couldn\'t build the bundle: ' + diag.error"></div>
              <pre class="kl-term flex-1 min-h-[16rem] whitespace-pre-wrap break-all" :class="diag.loading ? 'opacity-60' : ''"
                   x-text="diag.files ? (diag.files[diag.file] || '(empty)') : 'Building…'"></pre>
            </div>
          </div>
          <div class="kl-footer">
            <span class="kl-note" x-show="!diag.mailed">Download the bundle, then attach it to your report.</span>
            <span class="kl-note" x-show="diag.mailed">No email app opened? Write to <span class="text-fg" x-text="help && help.links && help.links.support_email"></span>
              <button type="button" class="kl-btn ml-1" style="height:22px" @click="copyText(help.links.support_email)">Copy</button></span>
            <span class="spacer"></span>
            <button class="kl-btn" @click="diagDownload()" :disabled="!diag.files || diag.loading">Download bundle</button>
            <button class="kl-btn" @click="diagOpenIssue()" :disabled="!diag.id">Open a GitHub issue</button>
            <button class="kl-btn" x-show="help && help.pro" @click="diagEmail()" :disabled="!diag.id">Email support</button>
          </div>
        </div>
      </template>
    </div>
