    <!-- Docs browser (docs.js): popup, side panel, or the whole page in its own window. -->
    <template x-if="docs">
      <div :class="docs.view === 'popup' ? 'fixed inset-0 z-[58] bg-black/40 flex items-center justify-center p-4 sm:p-6'
                 : (docs.view === 'side' ? 'fixed inset-y-0 right-0 z-[58] w-[36rem] max-w-full flex' : 'fixed inset-0 z-[58] flex bg-surface')"
           @click.self="docs.view === 'popup' && closeDocs()" role="dialog" aria-label="Documentation" data-testid="docs">
        <div class="flex flex-col bg-surface min-h-0"
             :class="docs.view === 'popup' ? 'w-[72rem] max-w-full h-[min(86vh,56rem)] rounded-lg border border-bd shadow-xl'
                   : (docs.view === 'side' ? 'w-full h-full border-l border-bd shadow-xl' : 'w-full h-full')">
          <div class="flex items-center gap-2 border-b border-bd px-4 py-2.5 shrink-0">
            <i class="ic ic-help text-muted"></i>
            <div class="font-medium">Documentation</div>
            <input autocomplete="off" type="search" x-model="docs.query" placeholder="Search documentation" aria-label="Search documentation"
                   class="fld h-8 border border-bd bg-surface2 ml-2 min-w-0 flex-1" :class="docs.view === 'side' ? '' : 'max-w-[22rem]'">
            <span class="grow" x-show="docs.view !== 'side'"></span>
            <button class="kl-btn icon" x-show="docs.view !== 'window'" @click="docsSetView(docs.view === 'popup' ? 'side' : 'popup')"
                    :title="docs.view === 'popup' ? 'Show as a side panel' : 'Show as a popup'" :aria-label="docs.view === 'popup' ? 'Show as a side panel' : 'Show as a popup'">
              <i class="ic" :class="docs.view === 'popup' ? 'ic-dock' : 'ic-expand'"></i></button>
            <button class="kl-btn icon" x-show="docs.view !== 'window'" @click="docsNewWindow()" title="Open in a new window" aria-label="Open in a new window"><i class="ic ic-external"></i></button>
            <button class="kl-btn icon" @click="closeDocs()" title="Close" aria-label="Close"><i class="ic ic-close"></i></button>
          </div>
          <div class="p-4 text-sm text-muted" x-show="docs.loading">Loading…</div>
          <div class="p-4 text-sm text-danger" x-show="docs.error" x-text="'Couldn’t load the documentation. ' + docs.error"></div>
          <div class="flex min-h-0 flex-1" x-show="!docs.loading && !docs.error">
            <!-- Contents: a list beside the page, or a picker above it in the narrow side panel. -->
            <nav class="w-56 shrink-0 overflow-y-auto border-r border-bd p-2 text-sm" x-show="docs.view !== 'side'" aria-label="Documentation pages">
              <button class="w-full text-left rounded px-2 py-1 hover:bg-head" :class="docs.page === 'README' ? 'bg-sel font-medium' : ''" @click="docsGo('README')">Contents</button>
              <template x-for="g in (_docsLoaded ? _docsLoaded.groups : [])" :key="g.title">
                <div class="mt-2">
                  <div class="px-2 pt-1 pb-0.5 text-[0.6875rem] text-faint" x-text="g.title"></div>
                  <template x-for="p in docsPages(g)" :key="p">
                    <div>
                      <button class="w-full text-left rounded px-2 py-1 hover:bg-head" :class="docs.page === p ? 'bg-sel font-medium' : ''" @click="docsGo(p)" x-text="docsTitle(p)"></button>
                      <template x-if="docs.page === p">
                        <div class="ml-3 border-l border-bd-soft">
                          <template x-for="s in docsSections()" :key="s.id">
                            <button class="w-full text-left px-2 py-0.5 text-xs text-muted hover:text-fg" :class="docs.section === s.id ? 'text-fg' : ''" @click="docsGo(p, s.id)" x-text="s.title"></button>
                          </template>
                        </div>
                      </template>
                    </div>
                  </template>
                </div>
              </template>
            </nav>
            <div class="flex-1 min-w-0 flex flex-col">
              <div class="border-b border-bd px-4 py-2 shrink-0" x-show="docs.view === 'side' && !docs.query">
                <select autocomplete="off" class="fld h-8 w-full border border-bd bg-surface2" aria-label="Documentation page" @change="docsGo($event.target.value)">
                  <option value="README" :selected="docs.page === 'README'">Contents</option>
                  <template x-for="g in (_docsLoaded ? _docsLoaded.groups : [])" :key="g.title">
                    <optgroup :label="g.title">
                      <template x-for="p in docsPages(g)" :key="p"><option :value="p" :selected="docs.page === p" x-text="docsTitle(p)"></option></template>
                    </optgroup>
                  </template>
                </select>
              </div>
              <div class="flex-1 min-h-0 overflow-y-auto p-4" x-show="docs.query.trim()">
                <div class="text-xs text-muted mb-2" x-text="docsResults().length ? countOf(docsResults().length, 'result') : 'No results for “' + docs.query.trim() + '”'"></div>
                <template x-for="(r, i) in docsResults()" :key="i">
                  <button class="block w-full text-left rounded px-2 py-1.5 hover:bg-head" @click="docsGo(r.page, r.section)">
                    <div class="text-sm font-medium"><span x-text="r.title"></span><span x-show="r.close" class="ml-2 text-xs font-normal text-muted">close match</span></div>
                    <div class="text-xs text-muted" x-text="r.snippet"></div>
                  </button>
                </template>
              </div>
              <article id="docsBody" class="kl-doc flex-1 min-h-0 overflow-y-auto px-6 py-4" x-show="!docs.query.trim()" x-html="docsHtml()" @click="docsClick($event)"></article>
            </div>
          </div>
        </div>
      </div>
    </template>
