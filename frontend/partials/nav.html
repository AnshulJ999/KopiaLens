
    <!-- One row normally; when zoomed in or narrow, the buttons wrap to a second row instead of being cut off. -->
    <header class="min-h-14 shrink-0 border-b border-bd bg-surface flex flex-wrap items-center gap-x-3 gap-y-2 px-4 py-2">
      <div class="flex items-start shrink-0">
        <button @click="goHome()" class="font-semibold text-lg" title="Go to the first tab">Kopia<span class="text-ok">Lens</span></button>
        <span x-show="lic.state === 'active' && showProBadge" x-cloak class="pro-mark" :title="lic.plan + (lic.name ? ', licensed to ' + lic.name : '')">Pro</span>
      </div>
      <div class="relative shrink-0" @click.outside="repoMenu = false">
        <button type="button" @click="repoMenu = !repoMenu" class="fld border border-bd bg-surface flex items-center gap-2 max-w-[16rem]"
                aria-haspopup="menu" :aria-expanded="repoMenu" title="Switch repository">
          <span class="truncate" x-text="repoName(repo)"></span>
          <svg class="h-3.5 w-3.5 shrink-0 text-muted" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>
        </button>
        <span x-show="isDemo()" x-cloak class="absolute -top-1.5 -right-2 rounded border border-warn-bd bg-warn-bg text-warn px-1 text-[0.625rem] font-medium leading-4"
              title="Invented names, real numbers. Actions are simulated and change nothing. Pro features are unlocked.">Demo</span>
        <div x-show="repoMenu" x-cloak role="menu" class="absolute left-0 top-full mt-1 z-50 w-64 rounded-md border border-bd bg-surface shadow-lg py-1 text-sm">
          <template x-for="item in repos" :key="item.id">
            <button type="button" role="menuitemradio" :aria-checked="item.id === repo" @click="pickRepo(item.id)"
                    class="w-full text-left px-3 py-1.5 hover:bg-head flex items-center gap-2">
              <span class="w-3 text-ok" x-text="item.id === repo ? '✓' : ''"></span>
              <span class="truncate flex-1" x-text="item.name"></span>
              <span class="text-[0.6875rem] text-muted" x-text="item.kind === 'backblaze' ? 'Backblaze' : cxTypeLabel((item.storage || {}).type)"></span>
            </button>
          </template>
          <div class="my-1 border-t border-bd"></div>
          <button type="button" role="menuitem" @click="openAddRepo()" class="w-full text-left px-3 py-1.5 hover:bg-head pl-8">Add repository…</button>
          <button type="button" role="menuitem" @click="openRepoAdmin()" class="w-full text-left px-3 py-1.5 hover:bg-head pl-8">Manage repositories…</button>
        </div>
      </div>
      <div class="relative flex-1 max-w-xl min-w-[12rem]">
        <!-- No @focus: switching tab on focus left Search blank until the first keystroke. Typing
             switches and loads; clicking in only focuses. -->
        <input x-model="query" @input.debounce.300ms="headerSearch()"
          class="fld w-full border border-bd bg-surface2 pl-9"
          :disabled="repoKind==='server'" :title="repoKind==='server' ? 'Search needs the index, and a kopia server connection has none' : ''"
          :placeholder="repoKind==='backblaze' ? 'Search Backblaze files…' : (repoKind==='server' ? 'Search needs the index' : 'Search files across all snapshots...')">
        <svg class="absolute left-3 top-2.5 h-4 w-4 text-faint" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      </div>
      <div class="ml-auto flex items-center gap-2 text-xs shrink-0">
        <template x-for="j in runningJobs" :key="j.job_id">
          <button @click="openJobPanel(j.job_id)" class="h-8 rounded border px-3 flex items-center gap-1.5"
            :class="j.state === 'running' ? 'border-warn-bd bg-warn-bg text-warn' : 'border-danger bg-danger-bg text-danger'"
            :title="(j.state === 'running' ? 'Running: ' : (j.state === 'failed' ? 'FAILED: ' : 'Finished with errors: ')) + j.kind_label + ' - click to open'">
            <span class="w-1.5 h-1.5 rounded-full" :class="j.state === 'running' ? 'bg-warn animate-pulse' : 'bg-danger'"></span>
            <span class="truncate max-w-[180px]" x-text="j.label"></span>
            <span x-text="j.total ? Math.round((j.done / j.total) * 100) + '%' : ''"></span>
          </button>
        </template>
        <span class="kl-dd" x-data="{ open: false }" @click.outside="open = false" @keydown.escape.stop="open = false" x-show="mounts.length" x-cloak>
          <button @click="open = !open; if (open) loadMounts()" class="h-8 rounded border border-bd bg-surface px-3 flex items-center gap-1.5"
                  :aria-expanded="open" data-testid="mount-chip" title="Mounted snapshots">
            <span x-text="mounts.length + ' mounted'"></span> ▾</button>
          <div class="absolute right-0 top-full mt-1 z-30 w-[52rem] max-w-[92vw] rounded-md border border-bd bg-surface shadow-lg text-sm" x-show="open" x-cloak>
{% include "partials/mountlist.html" %}
          </div>
        </span>
        <template x-for="p in indexPending" :key="p.repo">
          <span class="h-8 rounded border border-warn-bd bg-warn-bg text-warn px-2 flex items-center gap-2"
                :title="pendingTitle(p)">
            <span x-text="(p.repo !== repo ? repoLabel(p.repo) + ' · ' : '') + pendingText(p)"></span>
            <button x-show="p.reason !== 'first'" class="underline" @click="pendingRunNow(p.repo)">Update now</button>
          </span>
        </template>
        <span x-show="indexUpdated && indexUpdated.repo === repo" class="h-8 rounded border border-ok-bd bg-ok-bg text-ok px-2 flex items-center gap-2">
          <span>Index updated</span>
          <button class="underline" @click="reloadAfterIndex()">Reload</button>
        </span>
        <!-- Index status: click for the panel. While a pass runs it carries the live percentage
             (only when one honestly exists - the tree sync reports counters instead). -->
        <button x-show="repoKind!=='backblaze' && !isDemo()" @click="openIndexPanel()"
                class="h-8 rounded border px-2 flex items-center gap-1.5"
                :class="indexStatus.building ? 'border-warn-bd bg-warn-bg text-warn' : 'border-bd bg-surface2'"
                :title="indexTooltip()">
          <span x-show="indexStatus.building" class="w-2 h-2 rounded-full animate-pulse"
                :class="indexPct(indexStatus) == null ? 'bg-warn' : 'bg-ok'"></span>
          <span x-text="indexLine()"></span>
        </button>
        <button x-show="repoKind==='kopia' && !isDemo()" @click="buildIndex()" :disabled="!!indexStatus.building" class="h-8 rounded bg-fg px-3 text-surface disabled:opacity-50" :title="indexStatus.never_indexed ? 'Build the first index for this repo' : 'Update index (incremental)'" x-text="indexStatus.never_indexed ? 'Index now' : 'Index'">Index</button>
        <span x-show="repoKind==='backblaze'" class="rounded border border-bd bg-surface2 px-2 py-1" x-text="bzStatusLine()" :title="bzStatusTitle()"></span>
        <span x-show="repoKind==='backblaze' && bzRefreshResult" class="text-xs px-2 py-1 rounded" :class="bzRefreshResult.includes('FAILED') ? 'bg-danger-bg text-danger' : 'bg-ok-bg text-ok'" x-text="bzRefreshResult"></span>
        <button x-show="repoKind==='backblaze'" @click="bzRefresh()" class="h-8 rounded bg-fg px-3 text-surface" title="Re-scan the read-only Backblaze index">↻ Index BZ</button>
        <button @click="refreshAll()" class="h-8 rounded border border-bd px-3" title="Refresh current view + sources">⟳ Refresh</button>
        <button @click="toggleTimeFmt()" class="h-8 rounded border border-bd px-2" :title="timeFmt==='relative' ? 'Times shown as how long ago. Click to show dates.' : 'Times shown as dates. Click to show how long ago.'" x-text="timeFmt==='relative' ? '⏱ rel' : '🕒 abs'"></button>
        <div class="relative" x-data="{ open: false }" @click.outside="open = false" @keydown.escape.stop="open = false">
          <button @click="quickTheme()" @contextmenu.prevent="open = !open" class="h-8 w-8 rounded border border-bd" title="Switch between your light and dark theme. Right-click to pick a theme." x-text="dark ? '☀' : '☽'"></button>
          <div x-show="open" x-cloak role="menu" class="kl-menu" data-testid="theme-picker">
            <div class="hd">Theme</div>
            <template x-for="t in THEMES" :key="t.id">
              <button type="button" role="menuitemradio" :aria-checked="theme === t.id" @click="open = false; setTheme(t.id)" class="flex items-center gap-2" :title="t.title || ''">
                <span class="inline-block w-3.5 h-3.5 rounded-full border border-bd shrink-0" :style="'background:' + t.swatch"></span>
                <span class="flex-1" x-text="t.label"></span><span class="text-ok" x-text="theme === t.id ? '✓' : ''"></span>
              </button>
            </template>
            <div class="sep"></div>
            <button type="button" @click="open = false; settingsTab = 'appearance'; openSettings()">More in Settings…</button>
          </div>
        </div>
        <button x-show="update().available" x-cloak @click="showUpdate = true" class="h-8 rounded border border-ok-bd bg-ok-bg text-ok px-2"
                :title="'KopiaLens ' + update().latest + ' is out'">Update available</button>
        <div class="relative" @click.outside="helpMenu = false">
          <button @click="toggleHelpMenu()" class="h-8 w-8 rounded border border-bd" :title="acct && acct.sign_in_on ? 'Help and account' : 'Help'" aria-haspopup="menu" :aria-expanded="helpMenu">?</button>
          <div x-show="helpMenu" x-cloak role="menu" class="absolute right-0 top-full mt-1 z-50 w-64 rounded-md border border-bd bg-surface shadow-lg py-1 text-sm">
            <button type="button" role="menuitem" @click="helpLink('docs')" class="w-full text-left px-3 py-1.5 hover:bg-head">Documentation</button>
            <button type="button" role="menuitem" @click="openDiagnostics(true)" class="w-full text-left px-3 py-1.5 hover:bg-head">Report a problem…</button>
            <button type="button" role="menuitem" @click="openDiagnostics(false)" class="w-full text-left px-3 py-1.5 hover:bg-head">Create diagnostics bundle…</button>
            <button type="button" role="menuitem" @click="helpLink('discord')" :disabled="!(help && help.links && help.links.discord)"
                    data-placeholder="discord" :title="help && help.links && help.links.discord ? '' : 'Coming soon'"
                    class="w-full text-left px-3 py-1.5 hover:bg-head disabled:opacity-50 disabled:hover:bg-transparent">Discord</button>
            <div class="my-1 border-t border-bd"></div>
            <button type="button" role="menuitem" @click="checkUpdatesNow()" :disabled="checkingUpdates" class="w-full text-left px-3 py-1.5 hover:bg-head"
                    x-text="checkingUpdates ? 'Checking for updates…' : 'Check for updates'"></button>
            <button type="button" role="menuitem" @click="helpMenu = false; settingsTab = 'about'; openSettings()" class="w-full text-left px-3 py-1.5 hover:bg-head">About KopiaLens</button>
            <template x-if="isDesktopWindow()">
              <div>
                <div class="my-1 border-t border-bd"></div>
                <div class="flex items-center gap-1 px-3 py-1">
                  <span class="flex-1">Zoom</span>
                  <button type="button" @click="zoomStep(-1)" class="kl-btn" style="height:24px;width:28px;padding:0;justify-content:center" title="Zoom out (Ctrl -)" aria-label="Zoom out">−</button>
                  <span class="num w-11 text-center" x-text="Math.round((zoomLevel || 1) * 100) + '%'"></span>
                  <button type="button" @click="zoomStep(1)" class="kl-btn" style="height:24px;width:28px;padding:0;justify-content:center" title="Zoom in (Ctrl +)" aria-label="Zoom in">+</button>
                  <button type="button" @click="zoomReset()" class="kl-btn quiet" style="height:24px" :disabled="(zoomLevel || 1) === 1" title="Back to 100% (Ctrl 0)">Reset</button>
                </div>
                <button type="button" role="menuitem" x-show="canOpenInBrowser()" @click="openInBrowser()" class="w-full text-left px-3 py-1.5 hover:bg-head">Open in browser</button>
              </div>
            </template>
            <template x-if="acct && acct.sign_in_on && acct.username">
              <div data-testid="help-account">
                <div class="my-1 border-t border-bd"></div>
                <div class="px-3 py-1 text-xs text-muted">Signed in as <span class="text-fg font-medium" x-text="acct.username"></span></div>
                <button type="button" role="menuitem" @click="helpMenu = false; signOutHere()" class="w-full text-left px-3 py-1.5 hover:bg-head">Sign out</button>
              </div>
            </template>
          </div>
        </div>
        <button @click="openSettings()" class="h-8 w-8 rounded border border-bd" title="Settings">⚙</button>
      </div>
    </header>

    <!-- Tabs, then status chips. Chips never break inside; when there is no room the whole group
         wraps to a second row (zoom, big text, many repos) instead of running off the edge. -->
    <nav class="shrink-0 border-b border-bd-soft bg-surface px-3 py-1.5 flex flex-wrap items-center gap-1">
      <template x-for="t in currentTabs()" :key="t.id">
        <button class="tab" @click="active=t.id; activate()" :class="(active===t.id || (t.id==='snapshots' && active==='simulate')) ? 'bg-sel font-medium' : 'hover:bg-head'" x-text="t.label + (t.id === 'tasks' && tasksRunning ? ' (' + tasksRunning + ')' : '')"></button>
      </template>
      <div class="ml-auto flex flex-wrap items-center justify-end gap-x-2 gap-y-1 text-xs pr-2 min-w-0 max-w-full">
        <span x-show="indexPause.paused" class="rounded px-1.5 py-0.5 border border-warn-bd text-warn whitespace-nowrap"
              :title="pauseText() + '. Automatic indexing waits; Index still runs when you start it.'">
          Indexing paused · <button @click="resumeIndexing()" class="underline">Resume</button>
        </span>
        <span x-show="engine && engine.pause && engine.pause.on" x-cloak class="rounded px-1.5 py-0.5 border border-warn-bd text-warn whitespace-nowrap"
              :title="'Scheduled backups and maintenance by KopiaLens wait ' + enginePauseText(engine && engine.pause) + '.'">
          Backups paused · <button @click="engineResume(null)" class="underline">Resume</button>
        </span>
        <template x-for="f in freshness.filter((x) => !isDemo(x.repo))" :key="f.repo">
          <span class="rounded px-1.5 py-0.5 border whitespace-nowrap"
                :class="freshStale(f) ? 'border-warn-bd text-warn' : 'border-bd-soft text-muted'"
                :title="freshTitle(f)">
            <span x-text="repoLabel(f.repo)"></span>
            <span x-text="' · ' + freshAge(f)"></span>
            <span x-show="f.pending" x-text="' · queued'"></span>
            <span x-show="f.error" class="text-danger">!</span>
          </span>
        </template>
        <span x-show="busy" class="text-warn" x-text="busy"></span>
        <!-- the full error on hover: the line itself must stay short, a long backend message must not -->
        <span x-show="error" class="text-danger max-w-md truncate" :title="error" x-text="error"></span>
        <span class="text-muted whitespace-nowrap truncate max-w-full" x-show="navSource()" x-text="midTrunc(navSource(), 34)" :title="'Source: ' + navSource()"></span>
      </div>
    </nav>
