
    <header class="h-14 shrink-0 border-b border-bd bg-surface flex items-center gap-3 px-4">
      <button @click="active='dashboard'; loadDashboard()" class="font-semibold text-lg shrink-0">Kopia<span class="text-ok">Lens</span></button>
      <select x-model="repo" @change="repoChanged()" class="fld border border-bd bg-surface shrink-0">
        <template x-for="item in repos" :key="item.id"><option :value="item.id" x-text="item.name"></option></template>
      </select>
      <div class="relative flex-1 max-w-xl">
        <input x-model="query" @input.debounce.300ms="headerSearch()" @focus="active = repoKind==='backblaze' ? 'bz-search' : 'search'"
          class="fld w-full border border-bd bg-surface2 pl-9"
          :placeholder="repoKind==='backblaze' ? 'Search Backblaze files…' : 'Search files across all snapshots...'">
        <svg class="absolute left-3 top-2.5 h-4 w-4 text-faint" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      </div>
      <div class="ml-auto flex items-center gap-2 text-xs shrink-0">
        <template x-for="j in runningJobs" :key="j.job_id">
          <button @click="openJobPanel(j.job_id)" class="h-8 rounded border border-danger-bd px-3 text-danger flex items-center gap-1.5" :title="j.kind_label + ' - click to open'">
            <span class="w-1.5 h-1.5 rounded-full bg-danger animate-pulse"></span>
            <span class="truncate max-w-[180px]" x-text="j.label"></span>
            <span x-text="j.total ? Math.round((j.done / j.total) * 100) + '%' : ''"></span>
          </button>
        </template>
        <span x-show="repoKind!=='backblaze'" class="rounded border border-bd bg-surface2 px-2 py-1" x-text="indexLine()"></span>
        <button x-show="repoKind!=='backblaze'" @click="buildIndex()" :disabled="indexStatus.building" class="h-8 rounded bg-fg px-3 text-surface disabled:opacity-50" title="Update index (incremental)">Index</button>
        <span x-show="repoKind==='backblaze'" class="rounded border border-bd bg-surface2 px-2 py-1" x-text="bzStatusLine()"></span>
        <span x-show="repoKind==='backblaze' && bzRefreshResult" class="text-xs px-2 py-1 rounded" :class="bzRefreshResult.includes('FAILED') ? 'bg-danger-bg text-danger' : 'bg-ok-bg text-ok'" x-text="bzRefreshResult"></span>
        <button x-show="repoKind==='backblaze'" @click="bzRefresh()" class="h-8 rounded bg-fg px-3 text-surface" title="Re-scan the read-only Backblaze index">↻ Index BZ</button>
        <button @click="refreshAll()" class="h-8 rounded border border-bd px-3" title="Refresh current view + sources">⟳ Refresh</button>
        <button @click="toggleTimeFmt()" class="h-8 rounded border border-bd px-2" :title="timeFmt==='relative' ? 'Times: relative (click for absolute 12h)' : 'Times: absolute 12h (click for relative)'" x-text="timeFmt==='relative' ? '⏱ rel' : '🕒 abs'"></button>
        <button @click="quickTheme()" class="h-8 w-8 rounded border border-bd" title="Quick switch between your light and dark theme (pick themes in Settings)" x-text="dark ? '☀' : '☽'"></button>
        <button @click="openSettings()" class="h-8 w-8 rounded border border-bd" title="Settings">⚙</button>
      </div>
    </header>

    <nav class="shrink-0 border-b border-bd-soft bg-surface px-3 py-1.5 flex items-center gap-1">
      <template x-for="t in currentTabs()" :key="t.id">
        <button class="tab" @click="active=t.id; activate()" :class="active===t.id ? 'bg-sel font-medium' : 'hover:bg-head'" x-text="t.label"></button>
      </template>
      <div class="ml-auto flex items-center gap-2 text-xs pr-2">
        <template x-for="f in freshness" :key="f.repo">
          <span class="rounded px-1.5 py-0.5 border"
                :class="freshStale(f) ? 'border-warn-bd text-warn' : 'border-bd-soft text-muted'"
                :title="f.name + (f.error ? ' - last run failed: ' + f.error : '')">
            <span x-text="f.repo === 'bz' ? 'BZ' : 'Repo ' + f.repo"></span>
            <span x-text="' · ' + freshAge(f)"></span>
            <span x-show="f.error" class="text-danger">!</span>
          </span>
        </template>
        <span x-show="busy" class="text-warn" x-text="busy"></span>
        <span x-show="error" class="text-danger max-w-md truncate" x-text="error"></span>
        <span class="text-faint" x-show="selectedSource" x-text="'· ' + shortSource(selectedSource)"></span>
      </div>
    </nav>
