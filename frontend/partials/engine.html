
    <!-- Who runs this repository's backups (engine.js) -->
    <template x-if="engineDlg">
      <div class="fixed inset-0 z-[55] bg-black/40 flex items-center justify-center p-4 sm:p-6" @click.self="engineDlg = null" data-testid="engine-dialog">
        <div class="w-[36rem] max-w-full max-h-[88vh] flex flex-col rounded-lg border border-bd bg-surface shadow-xl text-sm">
          <div class="flex items-center gap-2 shrink-0 border-b border-bd px-4 py-3">
            <div class="font-medium" x-text="'Who runs backups for ' + repoName(engineDlg.repo) + '?'"></div>
            <span class="kl-help" tabindex="0" role="button" data-doc @click="openDocs('backups', 'who-runs-backups')" @keydown.enter.prevent="openDocs('backups', 'who-runs-backups')" title="Who runs backups">?</span>
            <button @click="engineDlg = null" class="ml-auto text-muted text-lg leading-none" aria-label="Close">&times;</button>
          </div>
          <div class="min-h-0 flex-1 overflow-y-auto p-4 space-y-3">
            <div x-show="engineDlg.loading" class="text-muted">Checking this computer…</div>
            <template x-if="engineDlg.data">
              <div class="space-y-3">
                <div class="kl-facts">
                  <template x-for="row in engineFacts(engineDlg.data)" :key="row[0]">
                    <div class="r"><span class="k" x-text="row[0]"></span><span class="break-all" x-text="row[1]"></span></div>
                  </template>
                </div>

                <template x-if="engineDlg.data.identity">
                  <div class="kl-callout space-y-1.5">
                    <div x-show="engineDlg.data.identity.split" title="Kopia treats each spelling as a separate computer. Merge to keep one history."
                         x-text="'This computer is listed under two names: ' + engineDlg.data.identity.suggested + ' and ' + engineDlg.data.identity.merge_from"></div>
                    <div x-show="engineDlg.data.identity.connect_needed" :title="'A backup from here would go under ' + engineDlg.data.identity.current + ', not ' + engineDlg.data.identity.suggested + '.'"
                         x-text="'This connection: ' + engineDlg.data.identity.current"></div>
                    <div class="flex flex-wrap gap-2">
                      <button class="kl-btn" style="height:24px" x-show="engineDlg.data.identity.connect_needed" @click="engineFixIdentity()" x-text="'Connect as ' + engineDlg.data.identity.suggested + '…'"></button>
                      <template x-if="engineDlg.data.identity.split">
                        <span class="flex gap-2">
                          <button class="kl-btn" style="height:24px" @click="engineMergeHistory(true)">Dry run the merge</button>
                          <button class="kl-btn" style="height:24px" @click="engineMergeHistory(false)" x-text="'Merge into ' + engineDlg.data.identity.suggested + '…'"></button>
                        </span>
                      </template>
                    </div>
                  </div>
                </template>

                <template x-for="h in engineDlg.data.health" :key="h.title">
                  <div class="text-xs" :class="h.level === 'error' ? 'text-danger' : 'text-warn'">
                    <span class="font-medium" x-text="h.title"></span><span x-show="h.detail" class="text-muted" x-text="' · ' + h.detail"></span>
                  </div>
                </template>
                <template x-for="h in engineDlg.data.hints" :key="h.title">
                  <div class="text-xs text-muted" :title="'If another app backs up this repository, choose who runs backups so they don\'t both run.'">
                    <span x-text="h.title"></span><span x-show="h.detail" x-text="' · ' + h.detail"></span>
                  </div>
                </template>

                <div class="space-y-2" role="radiogroup" aria-label="Who runs backups">
                  <label class="flex items-start gap-2 rounded border p-2.5 cursor-pointer" :class="engineDlg.choice === 'external' ? 'border-fg' : 'border-bd'">
                    <input autocomplete="off" type="radio" value="external" x-model="engineDlg.choice" class="mt-0.5">
                    <span><span class="font-medium" x-text="engineOtherApp(engineDlg.data) === 'another app' ? 'Another app, or nothing' : engineOtherApp(engineDlg.data)"></span>
                      <span class="block text-xs text-muted">KopiaLens shows and analyses the backups, and acts when you ask.</span></span>
                  </label>
                  <label class="flex items-start gap-2 rounded border p-2.5 cursor-pointer" :class="engineDlg.choice === 'kopialens' ? 'border-fg' : 'border-bd'">
                    <input autocomplete="off" type="radio" value="kopialens" x-model="engineDlg.choice" class="mt-0.5">
                    <span><span class="font-medium">KopiaLens</span>
                      <span class="block text-xs text-muted">KopiaLens runs kopia's schedules and maintenance for this repository while it's open.</span></span>
                  </label>
                </div>

                <template x-if="engineDlg.choice === 'kopialens' && engineDlg.data.status.choice !== 'kopialens'">
                  <div class="space-y-2 pl-1">
                    <template x-if="engineDlg.data.view.kopiaui_shares_file">
                      <div class="space-y-2">
                        <label class="flex items-start gap-2 text-xs">
                          <input autocomplete="off" type="radio" value="move" x-model="engineDlg.how" class="mt-0.5">
                          <span><span class="font-medium">Move this repository out of KopiaUI</span>
                            <span class="block text-muted">KopiaUI keeps its other repositories. It stops loading this one after it restarts. Handing back moves it back.</span>
                            <span x-show="engineDefaultConfig(engineDlg.data.view)" class="block text-warn">This is kopia's default connection. After a move, kopia commands typed in a terminal no longer find this repository.</span></span>
                        </label>
                        <label class="flex items-start gap-2 text-xs">
                          <input autocomplete="off" type="radio" value="share" x-model="engineDlg.how" class="mt-0.5">
                          <span><span class="font-medium">Keep sharing the connection with KopiaUI</span>
                            <span class="block text-muted">Quit KopiaUI and turn off its Launch At Startup, or KopiaLens waits until KopiaUI is closed.</span></span>
                        </label>
                      </div>
                    </template>
                    <label x-show="engineDlg.how === 'move' && engineDlg.data.view.kopiaui_shares_file" class="flex flex-col gap-1 text-xs font-medium">Repository password
                      <input type="password" x-model="engineDlg.password" autocomplete="off" class="fld border border-bd bg-surface2" data-testid="engine-password"></label>
                    <p x-show="engineDlg.how === 'move' && engineDlg.data.view.kopiaui_running" class="kl-note">KopiaUI is open. KopiaLens takes over when KopiaUI restarts.</p>
                    <div x-show="engineDlg.data.view.conflict && engineDlg.how !== 'move'" class="kl-callout flex items-center gap-2">
                      <span class="grow" x-text="engineDlg.data.view.conflict + ' Quit it first.'"></span>
                      <button class="kl-btn" style="height:24px" @click="openEngineDlg(engineDlg.repo)">Check again</button>
                    </div>
                    <p x-show="engineDlg.data.view.blinkdisk" class="kl-note">BlinkDisk runs its own schedule for this vault. Quit BlinkDisk while KopiaLens runs the backups.</p>
                  </div>
                </template>

                <template x-if="engineDlg.data.status.choice === 'kopialens'">
                  <div class="flex items-center gap-2 text-xs flex-wrap">
                    <span class="text-muted">Pause this repository's backups</span>
                    <template x-if="!(engineDlg.data.status.pause && engineDlg.data.status.pause.on)">
                      <select autocomplete="off" class="fld border border-bd bg-surface2" style="height:24px" aria-label="Pause for"
                              @change="engineDlgPause($event)">
                        <option value="">Pause for…</option>
                        <template x-for="c in pauseChoices()" :key="c[0]"><option :value="c[0]" x-text="c[1]"></option></template>
                        <option value="custom">Custom…</option>
                      </select>
                    </template>
                    <button x-show="engineDlg.data.status.pause && engineDlg.data.status.pause.on" class="kl-btn" style="height:24px"
                            @click="engineDlgResume()">Resume</button>
                  </div>
                </template>
              </div>
            </template>
            <p class="text-xs" style="color:var(--danger)" x-show="engineDlg.error" x-text="engineDlg.error"></p>
          </div>
          <div class="kl-footer">
            <span class="kl-note" x-show="engineDlg.data && engineDlg.data.status.state === 'failed'" x-text="engineDlg.data && engineDlg.data.status.error"></span>
            <span class="spacer"></span>
            <button type="button" x-show="!ob" @click="openTasksFor(engineDlg.repo)" class="kl-btn quiet">Show tasks</button>
            <button type="button" @click="engineDlg = null" class="kl-btn">Close</button>
            <button type="button" class="kl-btn primary" :disabled="!engineCanSave()" @click="engineSave()"
                    x-text="engineDlg.busy ? 'Saving…' : 'Save'"></button>
          </div>
        </div>
      </div>
    </template>
