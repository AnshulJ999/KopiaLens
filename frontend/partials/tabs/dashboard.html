      <section x-show="active==='dashboard'" class="h-full flex flex-col gap-2">
        <div class="kl-toolbar" data-testid="dashboard-strip">
          <button class="kl-btn" @click="openNewSnap()" x-show="!isDemo()" data-testid="new-snapshot">New snapshot…</button>
          <span class="kl-dd" x-data="{ open: false }" @click.outside="open = false" @keydown.escape.stop="open = false" x-show="engineFor() && !isDemo()" x-cloak>
            <button class="kl-btn" :class="backupsClass()" @click="open = !open" :aria-expanded="open" data-testid="backups-chip"
                    title="Who runs this repository's backups"><span x-text="backupsLine()"></span><i class="ic ic-caret-down"></i></button>
            <div class="kl-menu" style="left:0;right:auto" x-show="open" x-cloak>
              <button @click="open = false; openEngineDlg()">Who runs backups…</button>
              <div class="sep"></div>
              <template x-if="engine && engine.pause && engine.pause.on"><button @click="open = false; engineResume(null)">Resume all backups</button></template>
              <template x-if="!(engine && engine.pause && engine.pause.on)">
                <div>
                  <div class="hd">Pause all backups</div>
                  <template x-for="c in pauseChoices()" :key="c[0]"><button @click="open = false; enginePause(null, c[0])" x-text="c[1]"></button></template>
                  <button @click="open = false; enginePause(null, 'custom')">Custom…</button>
                </div>
              </template>
            </div>
          </span>
          <select x-show="showOwnerFilter()" x-cloak @change="setOwnerFilter($event.target.value)" class="fld border border-bd bg-surface max-w-[16rem]" title="Whose backups to show" data-testid="owner-filter">
            <option value="all" :selected="ownerFilter() === 'all'">All computers</option>
            <option value="me" :selected="ownerFilter() === 'me'" x-text="myOwner() ? 'This computer (' + myOwner() + ')' : 'This computer'"></option>
            <template x-for="o in otherOwners()" :key="o"><option :value="o" :selected="ownerFilter() === o" x-text="o"></option></template>
          </select>
          <span class="grow"></span>
          <span class="text-xs text-muted" x-show="dashboardMeta" title="Everything this repository stores, with shared data counted once">Repository holds <b class="text-fg font-medium" x-text="dashboardMeta"></b></span>
          <span class="kl-help" tabindex="0" role="button" data-doc @click="openDocs('dashboard')" @keydown.enter.prevent="openDocs('dashboard')" title="Double-click a row to see its snapshots. Right-click a row for more; right-click a column header for alignment, widths and columns.">?</span>
          <button class="kl-btn icon" @click="refreshDashboard()" title="Read new snapshots from kopia and recompute these numbers" aria-label="Refresh the Dashboard" data-testid="dashboard-refresh"><i class="ic ic-refresh"></i></button>
          <span class="kl-dd" x-data="{ open: false }" @click.outside="open = false" @keydown.escape.stop="open = false">
            <button class="kl-btn icon" @click="open = !open" title="More" aria-label="More"><i class="ic ic-more"></i></button>
            <div class="kl-menu" x-show="open" x-cloak>
              <button @click="open = false; csv('#dashboardTable','dashboard')">Export CSV</button>
              <button @click="open = false; showCli('sources')">Show command</button>
              <div class="sep"></div>
              <div class="hd">Rows per page</div>
              <template x-for="n in ['all', '25', '50', '100']" :key="n">
                <button @click="open = false; setDashPageSize(n)" class="flex items-center gap-2" data-testid="dash-page-size">
                  <i class="ic" :class="dashPageSize === n ? 'ic-check text-ok' : 'ic-dot opacity-0'"></i><span x-text="n === 'all' ? 'All' : n"></span></button>
              </template>
              <div class="sep"></div>
              <button @click="open = false; openTableLayout('#dashboardTable')">Table layout…</button>
            </div>
          </span>
        </div>
        <div id="dashboardTable" class="flex-1 min-h-0"></div>
      </section>
