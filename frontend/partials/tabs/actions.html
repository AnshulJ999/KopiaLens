      <section x-show="active==='actions'" class="h-full flex flex-col gap-3 overflow-auto">
        <div class="max-w-5xl kl-sec rounded border border-bd bg-surface p-3">
          <div class="h">
            <span>Mounted snapshots</span>
            <span class="count" x-text="mounts.length"></span>
            <span class="acts">
              <button class="kl-btn quiet" style="height:24px" @click="loadMounts()">Refresh</button>
              <button class="kl-btn danger" style="height:24px" x-show="mounts.length > 1" @click="unmountAll()">Unmount all</button>
            </span>
          </div>
          <div x-show="!mounts.length" class="kl-note">No mounted snapshots. Mount one from Snapshots, Tree, or a file's Versions.</div>
          <div class="kl-list" x-show="mounts.length">
            <template x-for="m in mounts" :key="m.pid">
              <div class="li">
                <span class="font-mono font-medium shrink-0" :class="m.mountpoint.length > 3 ? 'break-all' : ''" :style="m.mountpoint.length > 3 ? 'max-width:24rem' : 'width:3rem'" x-text="m.shown || m.mountpoint"></span>
                <span class="grow min-w-0">
                  <span class="font-mono break-all" x-text="mountLabel(m)"></span>
                  <span class="kl-note" x-show="m.path && m.path !== sourcePath(m.source || '')" x-text="' · ' + m.path"></span>
                </span>
                <span class="kl-note shrink-0" x-show="m.snap_time" x-text="'snapshot ' + humanTime(m.snap_time)"></span>
                <span class="kl-note shrink-0" x-text="repoLabel(m.repo)"></span>
                <button class="kl-btn quiet shrink-0" style="height:22px" x-show="host.can_open" @click="mountBrowse(m.pid)">Open</button>
                <button class="kl-btn danger shrink-0" style="height:22px" @click="unmount(m.pid)">Unmount</button>
              </div>
            </template>
          </div>
        </div>
        <pre x-show="actionText" class="min-h-0 overflow-auto rounded border border-bd bg-surface p-3 text-sm max-w-5xl" x-text="actionText"></pre>
      </section>
