      <section x-show="active==='tree'" class="h-full flex flex-col gap-2">
        <div class="flex flex-wrap items-center gap-2">
          <select x-model="selectedSource" @change="treeSourceChanged()" class="fld border border-bd bg-surface min-w-[24rem]">
            <option value="*ALL*">★ All sources (repo-wide aggregate)</option>
            <template x-for="s in sources" :key="s"><option :value="s" x-text="shortSource(s)"></option></template>
          </select>
          <select x-model="treeMode" @change="treeModeChanged()" class="fld border border-bd bg-surface" title="Tree view mode">
            <option value="full">Full snapshot</option>
            <option value="changed">Changed in this snapshot</option>
            <option value="reclaimable">Reclaimable (freed if deleted)</option>
            <option value="all">All snapshots</option>
          </select>
          <select x-show="selectedSource==='*ALL*'" x-model="treeWeek" @change="treeWeekChanged()" class="fld border border-bd bg-surface text-sm" title="What each source backed up that week. Files that did not change are not listed.">
            <option value="">Latest</option>
            <template x-for="w in treeWeekOptions" :key="w.v"><option :value="w.v" x-text="'Week ' + w.label"></option></template>
          </select>
          <button @click="toggleTreeDedupe()" class="h-8 rounded border border-bd px-2 text-sm" :class="treeDedupe ? 'bg-sel' : ''" title="Dedupe: collapse same-content files">⧉ Dedupe</button>
          <label class="flex items-center gap-1.5 text-xs" :class="(treeMode!=='all' && selectedSource!=='*ALL*') ? 'opacity-40' : ''" title="Only folders containing files deleted from disk (All-snapshots or All-sources)"><input type="checkbox" x-model="treeDeletedOnly" :disabled="treeMode!=='all' && selectedSource!=='*ALL*'" @change="treeFilterChanged()"> Deleted</label>
          <label class="flex items-center gap-1.5 text-xs" title="Only files ≥ 1 GB"><input type="checkbox" x-model="treeOverGb" @change="treeFilterChanged()"> &gt;1 GB</label>
          <input x-model="treeExt" @input.debounce.400ms="treeFilterChanged()" class="fld w-32 border border-bd bg-surface text-xs" placeholder="ext: iso,7z">
          <button @click="toggleTreeFlat()" class="h-8 rounded border border-bd px-2 text-sm" :class="treeFlat ? 'bg-sel' : ''" title="Flat: collapse folders, list all files under here (multi-select to remove)">☰ Flat</button>
          <select x-show="treeMode!=='all' && selectedSource!=='*ALL*'" x-model="selectedSnapshot" @change="treePrefix=sourceRoot(); loadTree()" class="fld border border-bd bg-surface min-w-[18rem]">
            <template x-for="sn in snapshots" :key="sn.id"><option :value="sn.id" x-text="humanTime(sn.start_time)"></option></template>
          </select>
          <button @click="treeUp()" class="h-8 rounded border border-bd px-3 text-sm" title="Up one level">⬆ Up</button>
          <button x-show="treeMode!=='all' && selectedSource!=='*ALL*'" @click="mountTreeSnapshot()" class="h-8 rounded border border-bd px-3 text-sm" title="Mount this snapshot (read-only) and open the current folder in Explorer">⤓ Mount &amp; browse</button>
          <button @click="removeSelectedTree()" class="h-8 rounded border border-danger-bd text-danger px-2 text-sm" title="Remove selected files, or a selected folder (chunked, respects filters)">🗑 Remove…</button>
          <button @click="batchExclude('tree')" class="h-8 rounded border border-bd px-2 text-sm" title="Copy exclude patterns for selected files">⊘ Exclude</button>
          <button @click="csv('#treeTable','tree')" class="h-8 rounded border border-bd px-3 text-sm" title="Export CSV">⬇ CSV</button>
        </div>
        <div class="flex items-center gap-1 text-sm flex-wrap px-1">
          <template x-for="(c, i) in treeCrumbs()" :key="i">
            <span><span class="crumb" @click="navTree(c.prefix)" x-text="c.label"></span><span class="text-faint" x-show="i < treeCrumbs().length - 1"> › </span></span>
          </template>
        </div>
        <div id="treeTable" class="flex-1 min-h-0"></div>
      </section>
