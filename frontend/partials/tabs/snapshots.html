      <section x-show="active==='snapshots'" class="h-full flex flex-col gap-2">
        <div class="flex flex-wrap items-center gap-2">
          <select x-model="snapSource" @change="changeSnapSource()" class="fld border border-stone-300 dark:border-stone-700 bg-white dark:bg-stone-800 min-w-[34rem] max-w-full">
            <option value="*ALL*">★ All sources (by reclaimable — run Analyze entire repo first)</option>
            <template x-for="s in sources" :key="s"><option :value="s" x-text="shortSource(s)"></option></template>
          </select>
          <button @click="analyzeSnapshots()" :disabled="analyzing" class="h-8 rounded border border-stone-300 dark:border-stone-700 px-3 text-sm disabled:opacity-50" title="Compute churn + reclaimable for this source (cached after)"><span x-text="analyzing ? 'Analyzing…' : 'Analyze this source'"></span></button>
          <button @click="analyzeAll()" :disabled="analyzingAll" class="h-8 rounded border border-stone-300 dark:border-stone-700 px-3 text-sm disabled:opacity-50" title="Compute churn + reclaimable for EVERY source in the repo (cached)"><span x-text="analyzingAll ? 'Analyzing repo…' : 'Analyze entire repo'"></span></button>
          <button @click="planDelete()" class="h-8 rounded border border-red-300 text-red-600 px-3 text-sm" title="Delete the selected snapshots (select rows first)">🗑 Delete selected</button>
          <button @click="csv('#snapshotsTable','snapshots')" class="h-8 rounded border border-stone-300 dark:border-stone-700 px-3 text-sm" title="Export CSV">⬇ CSV</button>
          <span class="text-xs text-stone-500">Select rows to delete · Churn = new data · Reclaimable = freed if deleted</span>
        </div>
        <div id="snapshotsTable" class="flex-1 min-h-0"></div>
      </section>
