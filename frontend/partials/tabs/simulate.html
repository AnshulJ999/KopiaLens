      <section x-show="active==='simulate'" class="h-full flex flex-col gap-2">
        <div class="kl-toolbar items-end">
          <label class="flex-col !items-start !gap-0.5 text-muted">Scope
            <select x-model="simMode" @change="simEmpty = true; openSimulate()" class="fld border border-bd bg-surface text-fg">
              <option value="all">All sources</option>
              <option value="one">One source</option>
            </select></label>
          <label x-show="simMode==='one'" class="flex-col !items-start !gap-0.5 text-muted">Source
            <select x-model="selectedSource" class="fld border border-bd bg-surface max-w-[22rem] text-fg">
              <template x-for="s in sources" :key="s"><option :value="s" x-text="shortSource(s)"></option></template>
            </select></label>
          <template x-for="k in policyKeys" :key="k">
            <label class="flex-col !items-start !gap-0.5 text-muted"><span x-text="simPolicyLabel(k)"></span>
              <input type="number" min="0" x-model.number="policy[k]" class="fld w-20 border border-bd bg-surface text-fg"></label>
          </template>
          <button @click="runSimulate()" class="kl-btn primary">Run</button>
          <span class="grow"></span>
          <span class="kl-help" tabindex="0" title="Try a retention policy without changing anything: see which snapshots it would keep and how much space deleting the rest frees. The boxes start from this repository's Global policy.">?</span>
          <span class="kl-dd" x-data="{ open: false }" @click.outside="open = false">
            <button class="kl-btn icon" @click="open = !open" title="More">⋯</button>
            <div class="kl-menu" x-show="open" x-cloak>
              <button @click="open = false; runSimulate(true)">Recompute (ignore the saved result)</button>
              <button @click="open = false; csv('#simulateTable','simulate')">Export CSV</button>
            </div>
          </span>
        </div>
        <div class="text-sm" x-show="simMeta" x-text="simMeta"></div>
        <div class="text-sm text-muted" x-show="simEmpty">Try a retention policy to see what it would keep and free, then press Run.</div>
        <div id="simulateTable" class="flex-1 min-h-0"></div>
      </section>
