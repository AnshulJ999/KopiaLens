
    <!-- Exclusion dialog: stacks over the detail modal (z-50 above its z-40), under the shared
         confirm (z-60). Every write is priced against the index before Exclude is enabled. -->
    <div x-show="showExclude" @click.self="showExclude=false" x-cloak class="fixed inset-0 z-50 bg-black/50 flex items-center justify-center p-6">
      <template x-if="exDialog">
        <div class="w-[46rem] max-w-full max-h-[90vh] overflow-hidden rounded-lg border border-bd bg-surface text-sm flex flex-col">
          <div class="shrink-0 px-4 pt-3 pb-2 border-b border-bd">
            <div class="flex items-center gap-2">
              <div class="font-medium" x-text="exDialog.mode === 'delete' ? 'Exclude & delete' : 'Exclude'"></div>
              <button @click="showExclude=false" class="ml-auto kl-btn quiet" title="Close">&times;</button>
            </div>
            <div class="kl-note mt-0.5 break-all font-mono" x-text="exDialog.path"></div>
          </div>

          <div class="flex-1 min-h-0 overflow-auto p-4 space-y-4">
            <!-- match type -->
            <div>
              <div class="text-xs font-medium mb-1">Match by</div>
              <span class="kl-seg">
                <span :class="exDialog.shape === 'exact' ? 'on' : ''" @click="exSelectShape('exact')">Exact path</span>
                <span :class="exDialog.shape === 'name' ? 'on' : ''" @click="exSelectShape('name')">Name</span>
                <span x-show="exDialog.kind === 'file'" :class="exDialog.shape === 'extension' ? 'on' : ''" @click="exSelectShape('extension')">Extension</span>
                <span :class="exDialog.shape === 'parent' ? 'on' : ''" @click="exSelectShape('parent')">Parent folder</span>
                <span :class="exDialog.shape === 'custom' ? 'on' : ''" @click="exSelectShape('custom')">Custom</span>
              </span>
              <div class="kl-note mt-1" x-show="exShapeLabel()" x-text="exShapeLabel()"></div>
              <template x-if="exDialog.shape === 'custom'">
                <div class="mt-2">
                  <input x-model="exDialog.custom" @input="exCustomInput()" @keydown.enter="exConfirm()"
                         class="fld w-full border border-bd bg-surface2 font-mono text-xs" placeholder="kopia ignore pattern, e.g. /Users/*/Cache/**">
                  <div class="kl-note mt-1">Written as-is to every ticked policy. A leading / starts from each backup's own folder.</div>
                </div>
              </template>
            </div>

            <!-- where the rule goes -->
            <div>
              <div class="flex items-center gap-2 mb-1">
                <div class="text-xs font-medium">Where the rule goes</div>
                <span class="kl-seg ml-auto" style="height:22px">
                  <span :class="exDialog.reach === 'smart' ? 'on' : ''" @click="exSetReach('smart')">Smart</span>
                  <span :class="exDialog.reach === 'manual' ? 'on' : ''" @click="exSetReach('manual')">Choose myself</span>
                </span>
              </div>
              <div class="kl-note mb-1" x-show="exDialog.loading">Reading policies…</div>
              <div class="kl-callout mb-1" x-show="exDialog.targetData && exDialog.targetData.error" x-text="exDialog.targetData ? exDialog.targetData.error : ''"></div>
              <div class="kl-note mb-1" x-show="!exDialog.loading && exDialog.targetData && !exTargets().length && !exDialog.targetData.error">No backup holds this path.</div>
              <div class="space-y-1">
                <template x-for="t in exTargets()" :key="t.target">
                  <div class="rounded border px-2 py-1.5"
                       :class="exDialog.ticked[t.target] ? 'border-fg bg-sel' : 'border-bd-soft'">
                    <div class="flex items-start gap-2 cursor-pointer" @click="exToggleTarget(t)"
                         :class="exPatternOf(t) ? '' : 'opacity-50 cursor-default'">
                      <input type="checkbox" :checked="!!exDialog.ticked[t.target]" class="shrink-0 mt-0.5" tabindex="-1">
                      <div class="min-w-0 grow">
                        <div class="flex items-center gap-2">
                          <span class="font-medium text-xs break-all" x-text="exLabel(t.target)"></span>
                          <span class="pill ok shrink-0" x-show="t.smart">Smart pick</span>
                          <span class="pill shrink-0" x-show="exPatternOf(t) && exDialog.shape !== 'custom' && exAlreadyOut(t)">already excluded</span>
                        </div>
                        <div class="kl-note" x-text="exWhy(t)"></div>
                        <div class="font-mono text-[11px] break-all" style="color:var(--muted)" x-show="exPatternOf(t)" x-text="exPatternOf(t)"></div>
                      </div>
                    </div>
                    <template x-if="t.role === 'child' && exDialog.ticked[t.target]">
                      <div class="ml-6 mt-1.5 pt-1.5 border-t border-dashed border-bd space-y-1">
                        <label class="flex items-start gap-2 text-xs cursor-pointer">
                          <input type="checkbox" class="mt-0.5" :checked="exCopies(t)" @change="exToggleCopyDown(t)">
                          <span>
                            <span class="font-medium" x-text="'Keep the ' + exRuleWord((t.inherited_rules || []).length) + ' it gets from ' + exLabel(t.inherits_from || 'global')"></span>
                            <span class="kl-note block">They're copied into this policy with the new rule. Later changes there won't reach it.</span>
                          </span>
                        </label>
                        <div class="kl-callout" x-show="!exCopies(t)"
                             x-text="exLabel(t.target) + ' stops using ' + exRuleWord((t.inherited_rules || []).length) + ' from ' + exLabel(t.inherits_from || 'global') + '. Files those rules leave out start being backed up again.'"></div>
                      </div>
                    </template>
                  </div>
                </template>
              </div>
              <div class="kl-note mt-2 font-medium" style="color:var(--fg)" x-show="exCoverageText()" x-text="exCoverageText()"></div>
            </div>

            <!-- price -->
            <div class="rounded border border-bd bg-surface2 p-2">
              <div class="flex items-center gap-2">
                <span class="text-xs font-medium">Leaves out</span>
                <span class="text-xs" x-show="exDialog.pricing" style="color:var(--muted)">checking the index…</span>
                <span class="text-xs font-medium" x-show="!exDialog.pricing && exKeepoutText()" x-text="exKeepoutText()"></span>
                <span class="text-xs" style="color:var(--muted)"
                      x-show="!exDialog.pricing && !exKeepoutText() && !exPriceNote()" x-text="exEmptyText()"></span>
                <span class="grow"></span>
                <button class="kl-btn quiet" style="height:22px" @click="exPriceAll()" :disabled="exDialog.pricing">Check again</button>
              </div>
              <div class="kl-note mt-1" x-show="!exDialog.pricing && exPriceNote()" x-text="exPriceNote()"></div>
            </div>

            <template x-if="exMatches().length">
              <div>
                <div class="text-xs font-medium mb-1">Matched files</div>
                <div class="kl-list" style="max-height:180px">
                  <template x-for="(m, i) in exMatches()" :key="i">
                    <div class="li">
                      <span class="font-mono break-all grow" x-text="m.path"></span>
                      <span class="num shrink-0" style="color:var(--muted)" x-text="m.size != null ? fmtB(m.size) : ''"></span>
                    </div>
                  </template>
                </div>
                <div class="kl-listfoot" x-show="exPreviewCap()">
                  <span x-text="exPreviewCap()"></span> ·
                  <button class="underline" style="color:var(--link)" @click="exToSearch()">Open in Search</button>
                </div>
              </div>
            </template>

            <div class="kl-note" x-show="exDialog.mode === 'delete'">After the rule is added, the delete flow opens for what's already backed up.</div>
          </div>

          <div class="kl-footer shrink-0">
            <span class="kl-note">A policy backup is taken first.</span>
            <span class="spacer"></span>
            <button class="kl-btn" @click="showExclude=false">Cancel</button>
            <button class="kl-btn primary" x-show="exDialog.mode === 'exclude'" @click="exConfirm()"
                    :disabled="exDialog.pricing || !exPriceReady()">Exclude…</button>
            <button class="kl-btn danger" x-show="exDialog.mode === 'delete'" @click="exConfirm()"
                    :disabled="exDialog.pricing || !exPriceReady()">Exclude and delete…</button>
          </div>
        </div>
      </template>
    </div>
