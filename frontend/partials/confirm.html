
    <!-- Shared confirm dialog. Stacks above every other modal (z-60). Short form
         (title + sentence) when the caller passes no facts; detailed form (facts table +
         callout) when it does. Copy command stays available so the manual path never is. -->
    <template x-if="confirmBox">
      <div class="fixed inset-0 z-[60] bg-black/40 flex items-center justify-center p-4 sm:p-6"
           @click.self="confirmResolve(false)"
           @keydown.enter.window="confirmEnter($event)"
           @keydown.tab.window="trapTab($event, $el)"
           x-init="$nextTick(() => confirmFocus($el))" role="dialog" aria-modal="true">
        <div class="w-[34rem] max-w-full rounded-lg border bg-surface shadow-xl flex flex-col" style="border-color:var(--bd)">
          <div class="p-4 space-y-3 overflow-auto">
            <h3 class="text-[15px] font-semibold leading-snug" x-text="confirmBox.title"></h3>
            <div class="text-[13px]" x-show="confirmBox.body" x-text="confirmBox.body"></div>
            <template x-if="confirmBox.facts">
              <div class="kl-facts">
                <template x-for="row in confirmBox.facts" :key="row[0]">
                  <div class="r"><span class="k" x-text="row[0]"></span><span class="break-all" x-text="row[1]"></span></div>
                </template>
              </div>
            </template>
            <div class="kl-callout" x-show="confirmBox.callout" x-text="confirmBox.callout"></div>
            <template x-if="confirmBox.input">
              <label class="block"><span class="text-xs text-muted" x-text="confirmBox.input.label"></span>
                <input class="fld border border-bd bg-surface2 w-full mt-1 text-xs" x-model="confirmBox.value" :placeholder="confirmBox.input.placeholder || ''"></label>
            </template>
            <div class="kl-note" x-show="confirmBox.note" x-text="confirmBox.note"></div>
          </div>
          <div class="kl-footer">
            <button x-show="confirmBox.command" @click="copyText(confirmBox.command)" class="kl-btn quiet">Copy command</button>
            <span class="spacer"></span>
            <button @click="confirmResolve(false)" class="kl-btn" data-cf="cancel">Cancel</button>
            <button @click="confirmResolve(true)" data-cf="ok" :class="confirmBox.danger ? 'kl-btn danger' : 'kl-btn primary'" x-text="confirmBox.confirmLabel"></button>
          </div>
        </div>
      </div>
    </template>
