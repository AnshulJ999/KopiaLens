[package]
name = "kopialens-scan"
version = "0.1.0"
description = "KopiaLens disk scanner: folder totals and name search, in parallel, with a time limit"
edition = "2021"
rust-version = "1.89"

[[bin]]
name = "kopialens-scan"
path = "src/main.rs"

[dependencies]
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
