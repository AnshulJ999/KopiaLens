[package]
name = "kopialens-desktop"
version = "0.31.0"
description = "KopiaLens desktop app: window, tray and server supervisor"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "kopialens_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
# devtools stays on in release builds: without it a shipped window has no inspector at all.
tauri = { version = "2.11.3", features = ["tray-icon", "devtools"] }
tauri-plugin-single-instance = "2.4.3"
tauri-plugin-window-state = "2.4.1"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tiny_http = "0.12.0"
# Loopback HTTP only, so no TLS stack.
ureq = { version = "2", default-features = false, features = ["json"] }
sysinfo = "0.37"
getrandom = "0.3"

[target."cfg(windows)".dependencies]
winreg = "0.56.0"
