[package]
name = "kopialens-desktop"
version = "0.32.0"
description = "KopiaLens desktop app: window, tray and server supervisor"
edition = "2021"
rust-version = "1.89"

[lib]
name = "kopialens_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
# devtools stays on in release builds: without it a shipped window has no inspector at all.
tauri = { version = "2.11.3", features = ["tray-icon", "devtools"] }
tauri-plugin-window-state = "2.4.1"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tiny_http = "0.12.0"
# Loopback HTTP only, so no TLS stack.
ureq = { version = "2", default-features = false, features = ["json"] }
sysinfo = "0.37"
getrandom = "0.3"

[target."cfg(windows)".dependencies]
winreg = "0.56.0"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

# Tray menu clicks stop working after about 64.5k menu items; see vendor/muda/KOPIALENS-PATCH.md.
[patch.crates-io]
muda = { path = "../vendor/muda" }
